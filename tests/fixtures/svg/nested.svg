<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff0000"/><stop offset="100%" stop-color="#0000ff" stop-opacity="0.5"/></linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="100" height="100"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="complex"><feGaussianBlur stdDeviation="3"/><feOffset dx="2"/></filter>
  </defs>
  <g id="logo" transform="translate(10 20) rotate(30) scale(2)" fill="#123456" stroke="#654321" stroke-width="2">
    <rect id="box" x="5" y="5" width="20" height="10" rx="2"/>
    <circle id="dot" cx="40" cy="10" r="4" fill="url(#grad)" opacity="0.5"/>
    <g id="inner" style="fill: #ffffff; stroke-dasharray: 4 2" clip-path="url(#clip)">
      <path id="curve" d="M0 0 Q 10 20 20 0 A 5 5 0 0 1 30 0 Z"/>
      <polyline id="poly" points="0,0 10,10 20,0"/>
      <text id="label" x="4" y="30" font-size="12" font-weight="bold" text-anchor="middle">Hello <tspan>there</tspan></text>
    </g>
    <ellipse id="blurred" cx="60" cy="60" rx="10" ry="5" filter="url(#blur)"/>
    <line id="line" x1="0" y1="0" x2="50" y2="50" stroke="currentColor" color="#abcdef"/>
    <rect id="filtered" width="5" height="5" filter="url(#complex)"/>
  </g>
  <mask id="m"><rect width="10" height="10"/></mask>
</svg>
